<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>QRコード多用途サイト｜ターミナル（改良版）</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#0b0b0b; color:#f2f2f2; }
      header { padding: 16px; font-weight: 700; font-size: 18px; border-bottom: 1px solid #333; }
      main { padding: 16px; display: grid; gap: 16px; }
      .card {
        border: 1px solid #333; border-radius: 14px; padding: 16px;
        box-shadow: 0 4px 14px rgba(0,0,0,.2); background: #0d0d0d;
      }
      .button{ display:inline-block; padding:8px 12px; border-radius:999px; border:1px solid #444; background:transparent; color:inherit; cursor:pointer; }
      .button.primary{ border-color:#3a7; }
      .muted { opacity:.8; font-size:14px }
      .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:space-between; }

      /* スタンプ */
      .stamps{ display:grid; gap:12px; grid-template-columns: repeat(3, minmax(0,1fr)); }
      .stamp{ border:1px dashed #444; border-radius:16px; min-height:84px; display:flex; align-items:center; justify-content:center; background:#0b0b0b; }
      .stamp.got{ color:#000; border-style:solid; }
      .stamp.got .label{ opacity:1 }
      .label{ font-weight:700; opacity:.7 }

      .toast{
        position:fixed; left:50%; bottom:40px; transform:translateX(-50%);
        background:#0f0; color:#000; font-weight:700; padding:10px 16px; border-radius:999px; display:none; z-index:2000;
      }

      /* スキャナ */
      .scanner {
        position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; color:#fff;
        z-index:1000; padding:16px; box-sizing:border-box;
      }
      .scanner.active{ display:block; }
      .scanner video{ width:100%; max-height:60vh; background:#000; border-radius:12px; }
      canvas#scanCanvas{ display:none; }

      .qr-grid{ display:grid; gap:16px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
      .qr-box{ border:1px solid #333; border-radius:12px; padding:10px; text-align:center; background:#fff; color:#000; }
      .qr-box .small{ font-size:12px; opacity:.8; margin-top:6px; word-break:break-all; }
    </style>

    <!-- ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <header>QRコード多用途サイト｜ターミナル</header>

    <main>
      <section class="card">
        <div class="row">
          <h3 style="margin:0">スタンプ</h3>
          <div class="row" style="gap:6px;">
            <button id="openScannerBtn" class="button primary">カメラで読み取る</button>
            <button id="resetStampsBtn" class="button">リセット</button>
          </div>
        </div>
        <div id="stamps" class="stamps"></div>
      </section>

      <section class="card">
        <h3>デバッグ用QR（印刷用）</h3>
        <div id="qrGrid" class="qr-grid"></div>
        <p class="muted">※各QRは redirect.html を経由し、既存タブを増やさずトップへ戻ります。</p>
      </section>

      <!-- デバッグカウンタ -->
      <section class="card">
        <h3>デバッグカウンタ（保持確認）</h3>
        <div class="row"><span>Count: <b id="counterValue">0</b></span>
          <button id="incBtn" class="button">＋1</button>
          <button id="resetBtn" class="button">リセット</button>
        </div>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <!-- スキャナUI -->
    <div id="scanner" class="scanner" role="dialog" aria-modal="true">
      <video id="scanVideo" playsinline></video>
      <canvas id="scanCanvas"></canvas>
      <button id="scanCloseBtn" class="button" style="margin-top:10px;">閉じる</button>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>

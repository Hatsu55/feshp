<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>文化祭ミニゲームターミナル｜ホーム</title>

    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0b;
        --panel: #13161b;
        --panel-soft: #1a1d23;
        --accent: #80ffe0;
        --text: #f3f5f7;
        --muted: rgba(243,245,247,0.55);
        --bottom: #020202;
        --window-btn: #2a2f36;
      }
      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .app-shell {
        width: min(100%, 440px);
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(circle at top, rgba(255,255,255,0.03), transparent 48%),
          var(--bg);
      }

      .top-safe {
        height: calc(env(safe-area-inset-top, 18px) + 8px);
        background: #000;
        border-bottom: 1px solid rgba(255,255,255,0.09);
        display: flex;
        align-items: flex-end;
        padding: 0 12px 4px;
        font-size: 10px;
        color: rgba(255,255,255,0.55);
      }

      .site-title {
        background: rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        margin: 12px 12px 6px;
        padding: 10px 14px;
        font-weight: 600;
        font-size: 14px;
      }

      .hero-area {
        margin: 6px 10px 4px;
        background: #fff;
        color: #000;
        border-radius: 6px;
        overflow: hidden;
        aspect-ratio: 9 / 4;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: left;
        position: relative;
      }
      .hero-inner {
        padding: 12px 14px;
        width: 100%;
      }
      .hero-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .hero-list {
        font-size: 12px;
        line-height: 1.4;
      }
      .hero-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0,0,0,.35);
        color: #fff;
        font-size: 10px;
        padding: 3px 6px;
        border-radius: 99px;
      }

      .info-panel {
        background: #242a33;
        border-radius: 20px;
        margin: 12px 12px 10px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255,255,255,0.7);
        font-weight: 500;
      }

      .nav-circles {
        display: flex;
        gap: 10px;
        padding: 0 12px;
        margin-bottom: 10px;
      }
      .nav-circle {
        flex: 1 1 0;
        background: linear-gradient(160deg, #2b323a, #1b1f23);
        border: 1px solid rgba(255,255,255,0.04);
        border-radius: 30px 30px 26px 26px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 11px;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.16s ease-out, box-shadow 0.16s ease-out, border-color 0.16s ease-out;
      }
      .nav-circle--active {
        background: radial-gradient(circle at 20% 10%, rgba(128,255,224,0.35), rgba(37,43,49,1) 60%), #252b31;
        box-shadow: 0 8px 22px rgba(0,0,0,0.4);
        transform: scale(1.02);
        border-color: rgba(128,255,224,0.55);
      }
      .nav-circle:active {
        transform: scale(0.97);
      }
      .nav-circle-label {
        position: absolute;
        bottom: -18px;
        left: 50%;
        transform: translateX(-50%);
        padding-top: 22px;
        font-size: 11px;
        color: rgba(255,255,255,0.75);
      }
      .nav-circle::after {
        content:"";
        position:absolute;
        inset:7px 12px 42px;
        border:1px dashed rgba(255,255,255,0.08);
        border-radius: 999px;
        pointer-events:none;
      }

      main { flex: 1; }

      .lower-panel {
        background: rgba(19,22,27,0.7);
        border-top: 1px solid rgba(255,255,255,0.035);
        margin: 8px 0 68px;
        padding: 12px;
        min-height: 200px;
      }

      /* viewごとのコンテナ */
      .view-panel {
        display: none;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.18s ease-out, transform 0.18s ease-out;
      }
      .view-panel--active {
        display: flex;
        flex-direction: column;
        gap: 12px;
        opacity: 1;
        transform: translateY(0);
      }

      .sub-card {
        background: rgba(2,3,4,0.25);
        border: 1px solid rgba(255,255,255,0.02);
        border-radius: 14px;
        padding: 10px 12px;
      }
      .sub-card-title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .debug-counter {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn-sm {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        color: inherit;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .bottom-nav {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 0;
        width: min(100%, 440px);
        background: rgba(0,0,0,0.85);
        border-top: 1px solid rgba(255,255,255,0.08);
        padding: 10px 18px 12px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        z-index: 50;
      }
      .bottom-dot {
        width: 42px;
        height: 42px;
        background: rgba(255,255,255,0.07);
        border-radius: 999px;
      }

      @media (prefers-reduced-motion: reduce) {
        .nav-circle,
        .view-panel {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="top-safe">
        このあたりに各スマホの上部UIが表示されている想定
      </div>

      <div class="site-title">
        文化祭ミニゲームターミナル（仮）
      </div>

      <div class="hero-area" id="heroArea">
        <div class="hero-inner">
          <div class="hero-title">画像が遷移する画面</div>
          <div class="hero-list">
            ・adminで設定した4種類の画像が一定時間ごとにループで切り替わっていく。<br>
            ・開始が近いイベントや目玉ゲームの画像を表示する予定。
          </div>
        </div>
        <div class="hero-badge" id="heroBadge">1 / 4</div>
      </div>

      <div class="info-panel">
        なにを表示するかは未定（ここは後で差し替え）
      </div>

      <div class="nav-circles">
        <div class="nav-circle nav-circle--active" data-view="games">
          ミニ<br>ゲーム
          <div class="nav-circle-label">Games</div>
        </div>
        <div class="nav-circle" data-view="stamps">
          スタンプ
          <div class="nav-circle-label">Stamps</div>
        </div>
        <div class="nav-circle" data-view="clubs">
          部展紹介
          <div class="nav-circle-label">Clubs</div>
        </div>
      </div>

      <main>
        <div class="lower-panel" id="lowerPanel">
          <!-- Gamesビュー -->
          <section class="view-panel" data-view-panel="games">
            <div class="sub-card">
              <div class="sub-card-title">ゲーム一覧</div>
              <div id="gamesList"
                   style="display:flex; flex-direction:column; gap:6px; font-size:13px;"></div>
            </div>
          </section>

          <!-- Stampsビュー（スタンプ＋カウンタ） -->
          <section class="view-panel" data-view-panel="stamps">
            <div class="sub-card" id="stampArea">
              <div class="sub-card-title">スタンプ取得テスト（仮配置）</div>
              <div id="stampSlots" style="display:flex; gap:8px;">
                <div style="width:58px; height:58px; border-radius:14px; background:#3a3f46; display:flex; align-items:center; justify-content:center; font-size:11px;" data-stamp="s1">s1</div>
                <div style="width:58px; height:58px; border-radius:14px; background:#3a3f46; display:flex; align-items:center; justify-content:center; font-size:11px;" data-stamp="s2">s2</div>
                <div style="width:58px; height:58px; border-radius:14px; background:#3a3f46; display:flex; align-items:center; justify-content:center; font-size:11px;" data-stamp="s3">s3</div>
              </div>
            </div>

            <div class="sub-card" id="counterArea">
              <div class="sub-card-title">デバッグカウンタ（自動保存）</div>
              <div class="debug-counter">
                <span>Count: <strong id="counterValue">0</strong></span>
                <button class="btn-sm" id="incBtn">＋1</button>
                <button class="btn-sm" id="resetBtn">リセット</button>
              </div>
            </div>
          </section>

          <!-- Clubsビュー（プレースホルダ） -->
          <section class="view-panel" data-view-panel="clubs">
            <div class="sub-card">
              <div class="sub-card-title">部展紹介（準備中）</div>
              <div style="font-size:13px; opacity:.8;">
                ここに各部活の展示紹介カードを並べる予定です。<br>
                写真・説明・場所などを1枚ずつ表示します。
              </div>
            </div>
          </section>
        </div>
      </main>

      <div class="bottom-nav">
        <div class="bottom-dot"></div>
        <div class="bottom-dot"></div>
        <div class="bottom-dot"></div>
        <div class="bottom-dot"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

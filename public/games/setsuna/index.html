<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>刹那の見切り（オンライン試作）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="setsuna-body">
    <div id="app" class="game-shell">
      <header class="game-header">
        <div class="game-title">刹那の見切り（オンライン試作）</div>
        <div class="game-state" id="game-state">state: init</div>
      </header>

      <!-- ステータスバー（共通ゲージ＋HP） -->
      <section class="status-panel">
        <div class="status-top-row">
          <div class="net-status" id="net-status-label">ネットワーク: 初期化中</div>
          <!-- 防御受付スライダー（デバッグ用） -->
          <!--
          <div class="defend-window-control">
            <label for="defend-window-range">
              防御受付
              <span id="defend-window-label">300ms</span>
            </label>
            <input
              id="defend-window-range"
              type="range"
              min="150"
              max="600"
              step="10"
              value="300"
            />
          </div>
          -->
        </div>

        <!-- 共通ゲージ -->
        <div class="common-gauge-wrap">
          <div class="common-gauge-label">
            <span>共通ゲージ</span>
            <span id="common-gauge-value" class="gauge-value">0%</span>
          </div>
          <div class="common-gauge-bar">
            <div id="common-gauge-fill" class="common-gauge-fill"></div>
          </div>
        </div>

        <!-- HP -->
        <div class="hp-wrapper">
          <div class="hp-block">
            <div class="hp-label">YOU</div>
            <div class="hp-track">
              <div id="hp-you" class="hp-fill hp-you"></div>
            </div>
          </div>
          <div class="hp-block">
            <div class="hp-label">ENEMY</div>
            <div class="hp-track">
              <div id="hp-enemy" class="hp-fill hp-enemy"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- メインエリア -->
      <main class="game-main">
        <!-- アラート -->
        <div class="alert-area">
          <div id="alert-symbol" class="alert-symbol">-</div>
          <div id="alert-text" class="alert-text">オンライン対戦の準備中です…</div>
        </div>

        <!-- タイマー(bar) -->
        <div id="timer-bar-wrap" class="timer-bar-wrap hidden">
          <div id="timer-bar" class="timer-bar"></div>
        </div>

        <div id="log-area" class="log-area"></div>
      </main>

      <!-- 操作 -->
      <footer class="game-footer">
        <button id="attack-btn" class="primary-btn" disabled>斬る / カウンター</button>
        <button id="rematch-btn" class="secondary-btn" disabled>再戦</button>
        <button id="reconnect-btn" class="secondary-btn hidden" disabled>再マッチング開始</button>
      </footer>

      <!-- Debug（試遊版では非表示にするためコメントアウト） -->
      <!--
      <section class="debug-panel" id="debug-panel">
        <h2>Debug</h2>
        <div class="debug-row">
          <span id="debug-role">role: -</span>
          <span id="debug-state">state: init</span>
        </div>
        <div class="debug-row">
          <span id="debug-hp">HP: -</span>
          <span id="debug-gauge">Gauge: -</span>
        </div>
      </section>
      -->
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

      const app = firebase.initializeApp(firebaseConfig);

    <!-- ネット層 -->
    <script type="module" src="./setsuna-net.js?v=20251103-r2"></script>
    <!-- ゲーム本体 -->
    <script type="module" src="./game.js?v=20251103-r2"></script>
  </body>
</html>

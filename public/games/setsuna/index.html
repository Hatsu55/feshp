<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>刹那の見切り（試作）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="setsuna-body">
    <div id="app" class="game-shell">
      <!-- 上部ヘッダ -->
      <header class="game-header">
        <div class="game-title">刹那の見切り（試作）</div>
        <div class="game-state" id="game-state">state: idle</div>
      </header>

      <!-- ★ 上部ステータスバー（共通ゲージ＋HP） -->
      <section class="status-bar">
        <!-- 共通ゲージ -->
        <div class="common-gauge-wrap">
          <div class="common-gauge-label">
            共通ゲージ
            <span id="common-gauge-value" class="gauge-value">0%</span>
          </div>
          <div class="common-gauge-track">
            <div id="common-gauge-fill" class="common-gauge-fill"></div>
          </div>
        </div>

        <!-- HP2本 -->
        <div class="hp-row">
          <div class="hp-block">
            <div class="hp-label">YOU</div>
            <div class="hp-track">
              <div id="hp-you" class="hp-fill hp-you"></div>
            </div>
          </div>
          <div class="hp-block">
            <div class="hp-label">ENEMY</div>
            <div class="hp-track">
              <div id="hp-enemy" class="hp-fill hp-enemy"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- メイン表示領域 -->
      <main class="game-main">
        <div id="alert-area" class="alert-area">
          <div id="alert-symbol" class="alert-symbol"></div>
          <div id="alert-text" class="alert-text"></div>
        </div>

        <!-- タイムバー（防御時だけ表示） -->
        <div id="timer-bar-wrap" class="timer-bar-wrap hidden">
          <div id="timer-bar" class="timer-bar"></div>
        </div>

        <!-- ログ -->
        <div id="log-area" class="log-area"></div>
      </main>

      <!-- コントロール領域（タップで斬る） -->
      <footer class="game-footer">
        <button id="attack-btn" class="primary-btn">斬る / COUNTER (タップ or Space)</button>
      </footer>

      <!-- デバッグパネル -->
      <section class="debug-panel" id="debug-panel">
        <h2>Debug</h2>
        <div class="debug-row">
          <button id="fake-enemy-attack-btn">相手が斬ってきた！</button>
        </div>
        <div class="debug-row">
          <label>敵の反応速度:
            <select id="enemy-speed-select">
              <option value="fast">fast (0.15s)</option>
              <option value="normal" selected>normal (0.25s)</option>
              <option value="slow">slow (0.4s)</option>
              <option value="random">random (0.15〜0.45)</option>
            </select>
          </label>
        </div>
        <div class="debug-row">
          <label>自分の防御受付(ms):
            <input type="range" id="defend-window-range" min="150" max="600" value="300" />
            <span id="defend-window-label">300ms</span>
          </label>
        </div>
      </section>
    </div>

    <script type="module" src="./game.js?v=20251103"></script>
    <!-- Firebase SDKs (Realtime Database 用) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js"></script>

    <!-- あなたのプロジェクト設定：必ず差し替え -->
    <script>
      // TODO: 自分のFirebaseコンソールで発行された内容に置き換えてください
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };
      const app = firebase.initializeApp(firebaseConfig);
      const rtdb = firebase.database();
      // 他ファイルでも使えるようにwindowに載せておく
      window.__SETUNA_RTDB__ = rtdb;
    </script>

    <!-- ネットワークアダプタ -->
    <script type="module" src="./setsuna-net.js?v=20251103"></script>
    <!-- ゲーム本体 -->
    <script type="module" src="./game.js?v=20251103"></script>
  </body>
</html>
